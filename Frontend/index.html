<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Gestión Bancaria</title>
    <!-- CSS Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Iconos Bootstrap -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <!-- Estilos Personalizados -->
    <link rel="stylesheet" href="css/styles.css">
</head>
<body class="bg-light">

    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary shadow-sm mb-4">
        <div class="container">
            <a class="navbar-brand fw-bold" href="#">
                <i class="bi bi-bank me-2"></i>Banco
            </a>
            <div class="navbar-nav">
                <button class="nav-link btn btn-link text-white active" onclick="showSection('view-customers')">Consultar Clientes</button>
                <button class="nav-link btn btn-link text-white" onclick="showSection('view-transfer')">Realizar Transferencia</button>
                <button class="nav-link btn btn-link text-white" onclick="showSection('view-history')">Histórico por Cliente</button>
            </div>
        </div>
    </nav>

    <div class="container">

        <!-- Contenedor de Alertas -->
        <div id="alert-container"></div>

        <!-- Vista 1: Consultar Clientes -->
        <section id="view-customers" class="card border-0 shadow mb-4">
            <div class="card-header bg-white py-3 d-flex justify-content-between align-items-center">
                <h4 class="mb-0 text-primary fw-bold">
                    <i class="bi bi-people-fill me-2"></i>Gestión de Clientes
                </h4>
                <button class="btn btn-outline-primary btn-sm rounded-pill px-3" onclick="loadCustomers()">
                    <i class="bi bi-arrow-clockwise me-1"></i> Ver Todos
                </button>
            </div>
            <div class="card-body p-4">

                <!-- Buscador por Nombre, Apellido o Nº de Cuenta -->
                <div class="row g-2 mb-4 bg-light p-3 rounded-3 align-items-end border">
                    <div class="col-md-9">
                        <label for="searchCustomerInput" class="form-label fw-bold text-secondary">
                            Buscar Cliente por Nombre, Apellido o Nº de Cuenta
                        </label>
                        <div class="input-group">
                            <span class="input-group-text bg-white"><i class="bi bi-search"></i></span>
                            <input type="text" 
                                   class="form-control" 
                                   id="searchCustomerInput" 
                                   placeholder="Ej: María López, Bryan o 15896"
                                   onkeydown="if(event.key === 'Enter') searchCustomer()">
                        </div>
                    </div>
                    <div class="col-md-3">
                        <button class="btn btn-primary w-100" onclick="searchCustomer()">
                            <i class="bi bi-search me-1"></i> Buscar
                        </button>
                    </div>
                </div>

                <!-- Tarjeta para Mostrar Únicamente al Usuario Encontrado -->
                <div id="customer-detail-card" class="d-none mb-4">
                    <!-- Se llena dinámicamente -->
                </div>

                <!-- Tabla General de Clientes -->
                <div class="table-responsive rounded-3 border">
                    <table class="table table-hover align-middle mb-0" id="customers-table">
                        <thead class="table-primary">
                            <tr>
                                <th class="py-3">ID</th>
                                <th class="py-3">Nombre</th>
                                <th class="py-3">Apellido</th>
                                <th class="py-3">Nº Cuenta</th>
                                <th class="py-3 text-end">Saldo Disponible</th>
                            </tr>
                        </thead>
                        <tbody id="customers-table-body">
                            <!-- Se llena dinámicamente -->
                        </tbody>
                    </table>
                </div>

            </div>
        </section>

        <!-- Vista 2: Realizar Transferencia -->
        <section id="view-transfer" class="card border-0 shadow mb-4 d-none">
            <div class="card-header bg-white py-3">
                <h4 class="mb-0 text-primary fw-bold">
                    <i class="bi bi-arrow-left-right me-2"></i>Transferencia de Dinero
                </h4>
            </div>
            <div class="card-body p-4">
                <form id="transfer-form" onsubmit="handleTransfer(event)" class="row g-3">
                    <div class="col-md-6">
                        <label for="senderAccount" class="form-label fw-bold">Número de Cuenta Remitente</label>
                        <input type="text" class="form-control" id="senderAccount" required placeholder="Ej: 15896">
                    </div>
                    <div class="col-md-6">
                        <label for="receiverAccount" class="form-label fw-bold">Número de Cuenta Receptor</label>
                        <input type="text" class="form-control" id="receiverAccount" required placeholder="Ej: 216354">
                    </div>
                    <div class="col-md-12">
                        <label for="amount" class="form-label fw-bold">Monto a Transferir ($)</label>
                        <input type="number" step="0.01" min="1" class="form-control" id="amount" required placeholder="0.00">
                    </div>
                    <div class="col-12 text-end mt-4 d-flex justify-content-end gap-2">
                        <button type="button" class="btn btn-outline-secondary px-4" onclick="clearTransferForm()">
                            <i class="bi bi-eraser me-1"></i> Limpiar Campos
                        </button>
                        <button type="submit" class="btn btn-success px-4">
                            <i class="bi bi-check-circle me-1"></i> Procesar Transferencia
                        </button>
                    </div>
                </form>
            </div>
        </section>

        <!-- Vista 3: Histórico de Transacciones -->
        <section id="view-history" class="card border-0 shadow mb-4 d-none">
            <div class="card-header bg-white py-3">
                <h4 class="mb-0 text-primary fw-bold">
                    <i class="bi bi-journal-text me-2"></i>Histórico de Transacciones
                </h4>
            </div>
            <div class="card-body p-4">
                <div class="row g-3 mb-4">
                    <div class="col-md-9">
                        <input type="text" 
                               class="form-control" 
                               id="searchAccount" 
                               placeholder="Ingrese el número de cuenta"
                               onkeydown="if(event.key === 'Enter') loadHistory()">
                    </div>
                    <div class="col-md-3">
                        <button class="btn btn-primary w-100" onclick="loadHistory()">
                            <i class="bi bi-search me-1"></i> Buscar Transacciones
                        </button>
                    </div>
                </div>
                <div class="table-responsive rounded-3 border">
                    <table class="table table-bordered table-hover mb-0">
                        <thead class="table-secondary">
                            <tr>
                                <th>ID Transacción</th>
                                <th>Cuenta Origen</th>
                                <th>Cuenta Destino</th>
                                <th>Monto</th>
                                <th>Fecha / Hora</th>
                            </tr>
                        </thead>
                        <tbody id="history-table-body">
                            <!-- Se llena dinámicamente -->
                        </tbody>
                    </table>
                </div>
            </div>
        </section>

    </div>

    <!-- Script Bootstrap 5 -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <!-- Script Aplicación -->
    <script src="js/app.js"></script>
</body>
</html>
